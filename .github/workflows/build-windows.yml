name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - ".github/dependabot.yml"
      - "app.py"
      - "cli.py"
      - "exporter_core.py"
      - "preview.py"
      - "wechat_data_dirs.py"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "assets/**"
      - "chat_list_service.py"
      - "export_task_service.py"
      - "ui/**"
      - "scripts/**"
      - "requirements-core.txt"
      - "requirements-build.txt"
      - "docs/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - ".github/dependabot.yml"
      - "app.py"
      - "cli.py"
      - "exporter_core.py"
      - "preview.py"
      - "wechat_data_dirs.py"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "assets/**"
      - "chat_list_service.py"
      - "export_task_service.py"
      - "ui/**"
      - "scripts/**"
      - "requirements-core.txt"
      - "requirements-build.txt"
      - "docs/**"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        profile: [core, full]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements.txt

      - name: Verify pinned wechatauto API
        shell: pwsh
        run: |
          @'
          import inspect
          import re
          from pathlib import Path

          import wechatauto
          from wechatauto import MediaDownloader, WeChatDB

          requirement_lines = Path("requirements.txt").read_text(
              encoding="utf-8"
          ).splitlines()
          pins = [
              line.strip()
              for line in requirement_lines
              if line.strip().startswith("wechatauto-replica")
          ]
          assert len(pins) == 1, (
              "requirements.txt must contain exactly one "
              "wechatauto-replica pin"
          )
          match = re.fullmatch(
              r"wechatauto-replica==([0-9A-Za-z._+-]+)",
              pins[0],
          )
          assert match, (
              "wechatauto-replica must remain an exact == version pin: "
              + pins[0]
          )
          expected_version = match.group(1)
          assert wechatauto.__version__ == expected_version, (
              expected_version,
              wechatauto.__version__,
          )

          for name in ("_open", "_nickname_index", "extract_master_key"):
              assert hasattr(WeChatDB, name), name
          for name in (
              "_collect_templates",
              "_get_xor_key",
              "_derive_cfg_key",
              "_scan_aes_key",
              "decrypt_image",
          ):
              assert hasattr(MediaDownloader, name), name

          stable_source = inspect.getsource(WeChatDB._stable_key_dirs)
          assert "WECHATAUTO_KEYS_DIR" in stable_source

          for name in ("_try_other_accounts", "_select_account_by_keys"):
              source = inspect.getsource(getattr(WeChatDB, name))
              assert "tempfile.gettempdir()" in source, name

          print(
              "wechatauto-replica contract OK:",
              wechatauto.__version__,
          )
          '@ | python -

      - name: Download pinned rust-silk
        shell: pwsh
        run: |
          $url = "https://github.com/Wangnov/rust-silk/releases/download/v0.1.3/rust-silk-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "rust-silk.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $expected = "44A01BC0F3EC3EC6F6044B656869B0DD7C298329D12F07C7F7A846BE72A89504"
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "rust-silk SHA256 mismatch. Expected $expected, got $actual"
          }

          $extract = Join-Path $env:RUNNER_TEMP "rust-silk"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Filter "rust-silk.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "rust-silk.exe was not found in the release archive"
          }
          New-Item -ItemType Directory -Path "tools" -Force | Out-Null
          Copy-Item $exe.FullName "tools\\rust-silk.exe" -Force

      - name: Syntax check
        shell: pwsh
        run: |
          python -m compileall -q app.py cli.py exporter_core.py preview.py wechat_data_dirs.py chat_list_service.py export_task_service.py ui scripts

      - name: Unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build and package V1 EXE
        shell: pwsh
        run: python scripts/build_windows.py --profile ${{ matrix.profile }} --layout onefile

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Export-WeChat-V1-${{ matrix.profile }}-Windows
          path: |
            dist/Export-WeChat-V1*.exe
            dist/Export-WeChat-V1*.zip
            dist/*-build.json
          if-no-files-found: error
